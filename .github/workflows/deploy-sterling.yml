name: Sterling Digital Solutions - validate and deploy AWS

on:
  # Commit updates automatically validate the template, but DO NOT deploy.
  push:
    branches: [main]
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy-sterling.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Check this box to REALLY deploy/update the AWS stack'
        required: true
        type: boolean
        default: false
      placement:
        description: 'public = cheaper learner-lab PoC; private = NAT gateway charges'
        required: true
        type: choice
        options:
          - public
          - private
        default: public
      seed_data:
        description: 'Insert two clearly labelled DEMO stock records after deployment'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# Avoid overlapping deployments changing the same named CloudFormation stack.
concurrency:
  group: sterling-aws-foundation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate AWS identity and CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Validate template (this step creates NO resources)
        run: |
          aws sts get-caller-identity --query 'Arn' --output text
          aws cloudformation validate-template \
            --template-body file://cloudformation/sterling-foundation.yaml

  deploy:
    name: Deploy VPC + ALB + EC2 ASG + DynamoDB
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Deploy CloudFormation stack
        env:
          PLACEMENT: ${{ inputs.placement }}
        run: |
          aws cloudformation deploy \
            --stack-name sterling-coursework-foundation \
            --template-file cloudformation/sterling-foundation.yaml \
            --parameter-overrides WebPlacement="$PLACEMENT" WebInstanceType=t3.micro \
            --no-fail-on-empty-changeset \
            --tags Project=SterlingDigitalSolutions Coursework=504AZ
      - name: Show stack outputs and website URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name sterling-coursework-foundation \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
      - name: Add sample trading data (not real market prices)
        if: ${{ inputs.seed_data == true }}
        shell: bash
        run: |
          TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name sterling-coursework-foundation \
            --query "Stacks[0].Outputs[?OutputKey=='TradingTableName'].OutputValue" \
            --output text)
          if [ -z "$TABLE_NAME" ]; then
            echo 'DynamoDB table output missing'; exit 1
          fi
          aws dynamodb put-item --table-name "$TABLE_NAME" \
            --item '{"StockSymbol":{"S":"AAPL"},"Price":{"N":"215.45"},"Exchange":{"S":"NASDAQ"},"Currency":{"S":"USD"},"RecordType":{"S":"DEMO-NOT-LIVE"}}'
          aws dynamodb put-item --table-name "$TABLE_NAME" \
            --item '{"StockSymbol":{"S":"TSLA"},"Price":{"N":"325.80"},"Exchange":{"S":"NASDAQ"},"Currency":{"S":"USD"},"RecordType":{"S":"DEMO-NOT-LIVE"}}'
          aws dynamodb scan --table-name "$TABLE_NAME" \
            --projection-expression 'StockSymbol,RecordType' --output table
